name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Typecheck Convex functions
        working-directory: packages/backend/convex
        run: ../node_modules/.bin/tsc --noEmit -p .
      - name: Typecheck and build web app
        working-directory: apps/web
        env:
          # Placeholders: the build only needs well-formed URLs.
          VITE_CONVEX_URL: https://ci-placeholder-1.convex.cloud
          VITE_CONVEX_SITE_URL: https://ci-placeholder-1.convex.site
        run: bun run check-types
