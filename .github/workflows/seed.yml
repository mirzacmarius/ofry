name: Demo data

# Loads or removes the demo listings on the production Convex deployment.
# Run it from the Actions tab: "Demo data" → "Run workflow".
# Only demo listings (sellerId "seed:*") are touched; real users' ads stay as they are.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "seed = wipe and reload the demo listings, clear = remove them"
        type: choice
        options: [seed, clear]
        default: seed
      photos:
        description: "placeholder = generated images, picsum = random stock photos, none = no photos"
        type: choice
        options: [placeholder, picsum, none]
        default: placeholder

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run seed function
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          ACTION: ${{ inputs.action }}
          PHOTOS: ${{ inputs.photos }}
        run: |
          if [ "$ACTION" = "clear" ]; then
            bunx convex run seed:clear
          else
            bunx convex run seed:run "{\"photos\":\"$PHOTOS\"}"
          fi
